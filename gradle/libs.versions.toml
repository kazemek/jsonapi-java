[versions]
groovy = "5.0.8"
spock = "2.4-groovy-5.0"
bytebuddy = "1.18.11"
sonarqube = "7.3.1.8318"
# Spotless 8.6+ greclipse fails input fingerprinting on cold CI (diffplug/spotless#2950).
spotless = "8.5.1"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.13.8"
errorprone-plugin = "5.1.0"
nullaway-plugin = "3.1.0"
archunit = "1.4.2"
jackson3 = "3.2.1"
json-schema-validator = "3.0.6"

[libraries]
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
groovy-all = { module = "org.apache.groovy:groovy-all", version.ref = "groovy" }
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
spotless-plugin = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-plugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorprone-plugin" }
nullaway-plugin = { module = "net.ltgt.nullaway:net.ltgt.nullaway.gradle.plugin", version.ref = "nullaway-plugin" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

[plugins]
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
